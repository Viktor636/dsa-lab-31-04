{% extends "base.html" %}

{% block content %}
<h2>📋 Список всех валют</h2>

<form method="GET" action="/currencies_page">
    <button type="submit">🔄 Обновить список</button>
</form>

<div class="result">
    {% if currencies %}
        <table border="1" style="border-collapse: collapse; width: 100%; margin-top: 20px;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название валюты</th>
                    <th>Курс к рублю</th>
                </tr>
            </thead>
            <tbody>
                {% for c in currencies %}
                <tr>
                    <td>{{ c.id }}</td>
                    <td>{{ c.name }}</td>
                    <td>{{ c.rate }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>Нет данных. Добавьте валюты!</p>
    {% endif %}
</div>

<div class="block">
    <a href="/">← Вернуться на главную</a>
</div>
{% endblock %}
