<!DOCTYPE html>
<html>
<head>
    <title>Currency Manager</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }
        .nav {
            margin-bottom: 20px;
            background: #eeeeee;
            padding: 10px;
        }
        .nav a {
            margin-right: 15px;
            color: blue;
        }
        .block {
            border: 1px solid #cccccc;
            padding: 15px;
            margin: 20px 0;
        }
        input {
            margin: 5px;
            padding: 5px;
            width: 150px;
        }
        button {
            margin: 5px;
            padding: 5px 10px;
            background: blue;
            color: white;
            border: none;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background: #f0f0f0;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Главная</a>
        <a href="/currencies_page">Список валют</a>
    </div>
    {% block content %}{% endblock %}
</body>
</html>
